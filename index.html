<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Encryption/Decryption Visualiser</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/themes.css">
</head>
<body>
    <div class="main-container">
        <h1>Data Encryption/Decryption Visualiser</h1>

        <div id="modeSwitch" class="switch-container"></div>

        <nav id="cipherPicker" class="cipher-picker" aria-label="Choose cipher"></nav>

        <div id="cipherInfo" class="algo-description"></div>

        <div id="optionsPanel" class="options-panel"></div>

        <div class="visualization-container">
            <div id="stepExplanation" class="info-panel" hidden></div>
            <div id="animationDisplay" class="animation-container"></div>
        </div>

        <div class="text-input-row">
            <label for="textInput">Enter Text:</label>
            <input type="text" id="textInput" placeholder="Type your message here">
        </div>

        <div id="controls" class="controls"></div>

        <div class="result-row">
            <p id="progressInfo">Ready to start!</p>
            <div id="resultBox">Results will show here</div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
