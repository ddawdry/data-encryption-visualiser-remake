<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Encryption/Decryption Visualiser</title>
    <meta name="description" content="An interactive tool for visualising how encryption, decryption, and cryptanalysis algorithms work, step by step — 20 algorithms across classical ciphers, modern cryptography, encoding, and cryptanalysis tools.">
    <meta name="theme-color" content="#4CAF50">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Data Encryption Visualiser">
    <meta property="og:description" content="An interactive tool for visualising how encryption, decryption, and cryptanalysis algorithms work, step by step.">
    <meta property="og:url" content="https://ddawdry.github.io/data-encryption-visualiser-remake/">
    <meta property="og:image" content="https://ddawdry.github.io/data-encryption-visualiser-remake/assets/icon-512.png">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Data Encryption Visualiser">
    <meta name="twitter:description" content="An interactive tool for visualising how encryption, decryption, and cryptanalysis algorithms work, step by step.">
    <meta name="twitter:image" content="https://ddawdry.github.io/data-encryption-visualiser-remake/assets/icon-512.png">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/themes.css">
</head>
<body>
    <div class="main-container">
        <div class="header-row">
            <h1>Data Encryption/Decryption Visualiser</h1>
            <button id="themeToggle" class="theme-toggle" type="button"></button>
        </div>

        <div id="modeSwitch" class="switch-container"></div>

        <nav id="cipherPicker" class="cipher-picker" aria-label="Choose cipher"></nav>

        <div id="cipherInfo" class="algo-description"></div>

        <div id="optionsPanel" class="options-panel"></div>

        <div class="visualization-container">
            <div id="stepExplanation" class="info-panel" role="status" hidden></div>
            <div id="cipherVisualization" class="cipher-visualization" hidden></div>
            <canvas id="animationCanvas" class="animation-canvas" aria-hidden="true"></canvas>
        </div>

        <div class="text-input-row">
            <label for="textInput">Enter Text:</label>
            <input type="text" id="textInput" placeholder="Type your message here">
        </div>

        <div id="controls" class="controls"></div>

        <div class="result-row">
            <p id="progressInfo">Ready to start!</p>
            <div id="resultBox">Results will show here</div>
        </div>

        <div class="comparison-panel">
            <label class="comparison-toggle-label">
                <input type="checkbox" id="compareToggle">
                Compare with another cipher
            </label>
            <div id="comparisonControls" class="comparison-controls" hidden>
                <label for="comparisonCipherSelect">Compare with:</label>
                <select id="comparisonCipherSelect"></select>
                <div id="comparisonResult" class="comparison-result"></div>
            </div>
        </div>

        <div id="historyPanel" class="history-panel" hidden></div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
